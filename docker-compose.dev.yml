# The whole Otter stack in one command:
#
#   docker compose -f docker-compose.dev.yml up
#
# Starts Postgres + Redis (pulled in from docker-compose.yml, unchanged) plus
# the API, the BullMQ worker, the dashboard, and the demo app. The landing page
# is deliberately absent — run it on the host with `bun run dev:landing`, same
# for the portfolio in the sibling repo.
#
# Two deliberate choices make this behave exactly like running the services by
# hand, which is the whole point:
#
#   network_mode: host — every apps/*/.env in this repo points at
#     localhost:5432 / :6379 / :8787, and OTTER_DASHBOARD_ORIGINS is
#     http://localhost:3001. On the host network those stay true, so there is
#     no second set of container-only env values to keep in sync, and the
#     landing page and portfolio you run on the host reach these services at
#     the addresses they already expect. Linux-only; that's what this repo
#     develops on.
#
#   The repo is bind-mounted, not copied — including node_modules. The image is
#     oven/bun:1, which is the same Bun (1.3.14) and the same glibc/x64 target
#     the host installed against, so the existing install is reused as-is and
#     there is no `bun install` step to wait through. Edits on the host are
#     picked up live by `bun --hot` and `next dev`, so this replaces
#     `bun run dev:all` rather than sitting alongside it.
#
# Unlike scripts/dev-all.ts, one service crashing doesn't take the others down.

include:
  - docker-compose.yml

x-bun: &bun
  image: oven/bun:1
  working_dir: /app
  volumes:
    - .:/app
  network_mode: host
  init: true
  tty: true
  restart: unless-stopped
  depends_on:
    packages:
      condition: service_completed_successfully

services:
  # Apps import otter-core/otter-db through dist/, and `bun --hot` does not
  # rebuild workspace packages — so this has to finish before anything starts.
  # Re-run it (`docker compose -f docker-compose.dev.yml up packages`) after
  # editing anything under packages/*/src, exactly as on the host.
  packages:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
    command: bun run build:packages
    restart: "no"

  api:
    <<: *bun
    command: bun run api
    depends_on:
      packages:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    <<: *bun
    command: bun run workers
    depends_on:
      packages:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Both Next services go through the root scripts, which point .next at
  # .next-dev before starting — never call `next dev` directly, here or
  # anywhere else, or the .next-main build cache gets clobbered.
  #
  # WATCHPACK_POLLING is not optional here, and it was measured rather than
  # cargo-culted. The repo lives on a fuseblk mount, and inotify events for it
  # do not cross the bind mount into the container: an edit is visible inside
  # the container instantly (`exec grep` sees it), but without polling webpack
  # never invalidates the module — no recompile after 30s, browser unchanged.
  # With it, the rebuild lands in ~1s and the open page updates. `bun --hot` in
  # api/workers sees the events fine, so those need no equivalent. Polling
  # costs a little idle CPU; watchpack skips node_modules.
  #
  # Note when testing this by hand: `curl` is a bad probe. Next's dev server
  # can keep answering plain GETs from a cached render well after it has
  # recompiled and pushed the update to connected browsers. Check in a browser.
  web:
    <<: *bun
    command: bun run dev:web
    environment:
      WATCHPACK_POLLING: "1000"

  demo:
    <<: *bun
    command: bun run dev:demo
    environment:
      WATCHPACK_POLLING: "1000"
