name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_SECRET: ci-better-auth-secret-ci-better-auth-secret
      DATABASE_URL: postgres://postgres@localhost:5432/otto
      NEXT_TELEMETRY_DISABLED: "1"
      OPENROUTER_API_KEY: ci-not-used
      OTTO_API_KEY_SECRET: ci-otto-api-key-secret-ci-otto-api-key-secret
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Validate docker-compose
        run: docker compose config
