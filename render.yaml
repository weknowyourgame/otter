services:
  - type: web
    name: otter-web
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: checksPass
    buildCommand: bun install --frozen-lockfile && bun run build:packages && bun run next:dist apps/web .next-main && bun run --cwd apps/web build
    startCommand: bun run next:dist apps/web .next-main && bun run --cwd apps/web start -- -p $PORT
    envVars:
      - key: BUN_VERSION
        value: 1.2.11
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: OTTER_API_URL
        fromService:
          name: otter-api
          type: web
          property: hostport
      - key: NEXT_PUBLIC_OTTER_PUBLIC_KEY
        sync: false

  - type: web
    name: otter-api
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: checksPass
    buildCommand: bun install --frozen-lockfile && bun run build:packages
    startCommand: bun run --cwd apps/api start
    healthCheckPath: /health
    envVars:
      - key: BUN_VERSION
        value: 1.2.11
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: otter-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: otter-redis
          type: keyvalue
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: OTTER_API_KEY_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: OTTER_DASHBOARD_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
  - type: keyvalue
    name: otter-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: otter-postgres
    plan: free
    region: oregon
    databaseName: otter
    user: otter
